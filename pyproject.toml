[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt"
version = "2.0.0"
description = "A high-performance, modular GPT implementation built from scratch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Andrej Karpathy"},
]
keywords = ["gpt", "transformer", "language-model", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
train = [
    "datasets>=2.14.0",
    "transformers>=4.30.0",
]
logging = [
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
]
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
all = ["nanogpt[train,logging,export,dev]"]

[project.scripts]
nanogpt-train = "nanogpt.train:main"
nanogpt-generate = "nanogpt.generate:main"

[project.urls]
Homepage = "https://github.com/karpathy/build-nanogpt"
Repository = "https://github.com/karpathy/build-nanogpt"

[tool.setuptools.packages.find]
include = ["nanogpt*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
