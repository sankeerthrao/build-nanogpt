# GPT-2 124M reproduction config
# Matches the original Karpathy build-nanogpt settings

# Model
block_size: 1024
vocab_size: 50304
n_layer: 12
n_head: 12
n_embd: 768
use_rope: false
use_swiglu: false
use_rmsnorm: false
dropout: 0.0

# Training
max_steps: 19073
total_batch_size: 524288
micro_batch_size: 64
learning_rate: 6.0e-4
min_lr_ratio: 0.1
warmup_steps: 715
weight_decay: 0.1
grad_clip: 1.0
lr_schedule: cosine
dtype: bfloat16

# Data
data_root: edu_fineweb10B

# Evaluation
val_interval: 250
val_steps: 20
hellaswag_eval: true
generate_interval: 250
generate_samples: 4
generate_max_length: 32

# Checkpointing
log_dir: log
checkpoint_interval: 5000
keep_last_n_checkpoints: 3

# Logging
use_wandb: false
use_tensorboard: false
